[project]
name = "newsbot"
version = "0.1.0"
description = "RSS to Telegram morning briefing"
requires-python = ">=3.11,<3.12"
dependencies = [
  "feedparser>=6.0.11",
  "requests>=2.32.0",
  "PyYAML>=6.0.1",
  "python-dateutil>=2.9.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
