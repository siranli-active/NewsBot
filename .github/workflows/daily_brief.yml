name: Daily Morning Brief

on:
  schedule:
    - cron: "*/15 6-8 * * *"
  workflow_dispatch:

concurrency:
  group: daily-morning-brief-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-brief:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run tests
        run: pytest -q

      - name: Print schedule times
        run: |
          date -u
          TZ=Europe/London date

      - name: Get London send date
        id: send-date
        run: echo "date=$(TZ=Europe/London date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore sent marker
        id: sent-marker
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .sent-marker
          key: morning-brief-${{ steps.send-date.outputs.date }}

      - name: Send morning brief
        if: github.event_name == 'workflow_dispatch' || steps.sent-marker.outputs.cache-hit != 'true'
        run: python main.py

      - name: Write sent marker
        if: github.event_name == 'schedule' && steps.sent-marker.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sent-marker
          date -u > ".sent-marker/${{ steps.send-date.outputs.date }}"

      - name: Save sent marker
        if: github.event_name == 'schedule' && steps.sent-marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sent-marker
          key: morning-brief-${{ steps.send-date.outputs.date }}
